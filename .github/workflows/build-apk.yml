name: Build Hooshyar APK

on:
  push:
    branches: [main, feature/professional-alarm-clock, redesign/premium-clock-ui, feature/persian-premium-navigation, feature/hooshyar-name-math-rtl, fix/hooshyar-worldclock-timer-rgb-lockscreen, fix/hooshyar-alarm-lockscreen-worldclock-ui, fix/hooshyar-worldclock-crash-lockscreen-alarm, fix/world-clock-reliability-timer-unit-labels, fix/world-clock-snooze-lockscreen-reliability, feature/ui-persian-font-desk-clock, fix/wake-bugs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Run Android lint and unit tests
        run: gradle --no-daemon lintDebug testDebugUnitTest
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clock-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload raw build output
        uses: actions/upload-artifact@v4
        with:
          name: Hooshyar-build-output
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare Hooshyar APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk "Hooshyar-v1.0.${{ github.run_number }}.apk"
      - name: Upload named Hooshyar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hooshyar-APK
          path: Hooshyar-v1.0.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
      - name: Update Hooshyar v1.0.62 release notes
        if: "github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'docs(release): document Hooshyar changes')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## تغییرات نسخه هوشیار (Hooshyar)

          ### رفع باگ‌ها
          - **راه رفتن:** شمارش قدم دوباره کار می‌کند؛ اجازهٔ «فعالیت بدنی» درخواست می‌شود و اگر قدم‌شمار نبود از حرکت‌سنج استفاده می‌شود. پیشرفت روی صفحه دیده می‌شود.
          - **الگو:** صفحهٔ کشیدن الگو از نو ساخته شد؛ با وصل کردن حداقل ۴ نقطه هشدار خاموش می‌شود.
          - **دکمه‌های نوتیفیکیشن:** «خاموش» و «چرت» حالا درست کار می‌کنند.
          - **صفحهٔ قفل:** اجازهٔ نمایش روی سایر برنامه‌ها اضافه شد و در صفحهٔ اصلی یک راهنمای تنظیمات (اعلان، نمایش تمام‌صفحه، نمایش روی برنامه‌ها) نشان داده می‌شود.

          ### تنظیمات چرت زدن
          - حالا برای هر هشدار، داخل صفحهٔ ساخت/ویرایش هشدار است (تعداد دفعات و مدت هر چرت)؛ بخش جدا حذف شد.

          > توجه: روی بعضی گوشی‌ها (شیائومی، سامسونگ و...) باید در تنظیمات گوشی اجازهٔ «نمایش روی صفحهٔ قفل» را هم بدهید.
          NOTES
          sed -i 's/^          //' release-notes.md
          gh release create "$TAG" "Hooshyar-v1.0.${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Hooshyar $TAG" \
            --notes-file release-notes.md
