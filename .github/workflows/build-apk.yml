name: Build Hooshyar APK

on:
  push:
    branches: [main, feature/professional-alarm-clock, redesign/premium-clock-ui, feature/persian-premium-navigation, feature/hooshyar-name-math-rtl, fix/hooshyar-worldclock-timer-rgb-lockscreen]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Run Android lint and unit tests
        run: gradle --no-daemon lintDebug testDebugUnitTest
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clock-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload raw build output
        uses: actions/upload-artifact@v4
        with:
          name: Hooshyar-build-output
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare Hooshyar APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk "Hooshyar-v1.0.${{ github.run_number }}.apk"
      - name: Upload named Hooshyar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hooshyar-APK
          path: Hooshyar-v1.0.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
      - name: Update Hooshyar v1.0.62 release notes
        if: "github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'docs(release): document Hooshyar changes')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## تغییرات نسخه هوشیار (Hooshyar) — v1.0.62

          ### تغییرات اصلی
          - **نام برنامه:** نام فارسی برنامه «هوشیار» و نام انگلیسی آن **Hooshyar** یکدست‌سازی شد.
          - **نمایش عبارت‌های ریاضی فارسی:** عبارت‌های ریاضی به ترتیب چپ‌به‌راست نمایش داده می‌شوند تا عملیاتی مانند ۱۰ − ۵ به‌درستی خوانده و تفسیر شوند.
          - **هشدار روی صفحه قفل:** مسیر نمایش تمام‌صفحه هشدار و مدیریت اعلان هشدار به‌روزرسانی شد.
          - **تعویق هشدار (Snooze):** مسیر تعویق و بازگشت به صفحه هشدار اصلاح شد.
          - **رفتار پس از زنگ خوردن:** منطق حذف/مدیریت هشدار پس از زنگ خوردن تنظیم شد.
          - **تایمر و کرنومتر:** اصلاحات کد Kotlin برای رفع مشکلات ساخت و بهبود سازگاری اعمال شد.

          ### بررسی ساخت
          - بررسی‌های Android lint و تست‌های واحد با موفقیت اجرا شدند.
          - فایل APK از سورس شاخه main در همین اجرای موفق GitHub Actions ساخته شده است.

          ### دانلود
          فایل Hooshyar-v1.0.62.apk را از بخش Assets همین صفحه دریافت کنید.

          > توجه: موفقیت ساخت و تست‌های خودکار به معنی آزمایش کامل روی همه مدل‌های گوشی نیست. عملکرد آلارم، صفحه قفل و نمایش ریاضی را پس از نصب روی دستگاه خود نیز بررسی کنید.
          NOTES
          sed -i 's/^          //' release-notes.md
          gh release edit v1.0.62 --repo "${{ github.repository }}" --title "Hooshyar v1.0.62" --notes-file release-notes.md
      - name: Publish Hooshyar APK to GitHub Release
        if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'docs(release): document Hooshyar changes')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cat > release-notes.md <<'NOTES'
          ## تغییرات نسخه هوشیار (Hooshyar)

          ### قابلیت‌ها و بهبودهای جدید
          - **ساعت جهانی:** نمایش نام شهر و کشور به‌همراه پرچم برای شهرهای شناخته‌شده و امکان جست‌وجوی شهر/منطقه زمانی.
          - **زمان‌سنج:** افزودن انتخاب ساعت تا ۱۰۰ و انتخاب دقیقه و ثانیه تا ۶۰؛ زمان‌های پیشنهادی قبلی حفظ شده‌اند.
          - **رنگ‌های زنده:** اضافه‌شدن تغییر تدریجی رنگ طیف RGB/HSV به نمایشگر زمان‌سنج و کرنومتر.
          - **هشدار روی صفحهٔ قفل:** تقویت اعلان تمام‌صفحه و روشن نگه‌داشتن نمایشگر هنگام زنگ‌خوردن، مطابق مجوزها و محدودیت‌های اندروید.
          - **رابط فارسی:** حفظ نام «هوشیار» و نام انگلیسی **Hooshyar** و اصلاحات قبلی نمایش عبارت‌های ریاضی راست‌چین/چپ‌به‌راست.
          - **هشدارها:** بهبود مسیر تعویق هشدار و مدیریت حالت پس از زنگ‌خوردن.

          ### اعتبارسنجی و محدودیت‌های شناخته‌شده
          - Android lint، تست‌های واحد و ساخت APK در GitHub Actions با موفقیت انجام شده‌اند.
          - نام کشور و پرچم در فهرست ساعت جهانی برای همهٔ مناطق زمانی پوشش کامل ندارد؛ جست‌وجوی کشورها نیز ممکن است برای برخی مناطق نتیجهٔ کامل ندهد.
          - نمایش هشدار روی صفحهٔ قفل به نسخهٔ اندروید، مجوز Full-screen intent و تنظیمات سازندهٔ گوشی وابسته است و روی همهٔ دستگاه‌ها فیزیکی تأیید نشده.
          - تغییر رنگ زنده با دفعات به‌روزرسانی رابط کاربری انجام می‌شود؛ انیمیشن پیوسته در همهٔ حالت‌ها تأیید نشده است.
          - این نسخه پیش از انتشار نهایی باید روی گوشی واقعی آزمایش شود. تست خودکار موفق، تضمین بی‌نقص بودن همهٔ قابلیت‌ها نیست.
          NOTES
          sed -i 's/^          //' release-notes.md
          gh release create "$TAG" "Hooshyar-v1.0.${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Hooshyar $TAG" \
            --notes-file release-notes.md
